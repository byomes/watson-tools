<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161412" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>Private app</title>
<style>
:root{--bg:#faf7f2;--fg:#1f1b16;--mut:#7a7167;--ac:#2f6f5e}
@media(prefers-color-scheme:dark){:root{--bg:#161412;--fg:#f1ece4;--mut:#a39a8e;--ac:#6fc2a9}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,sans-serif;text-align:center;padding:18vh 24px 24px}
h1{margin:0 0 6px}p{color:var(--mut);margin:0 0 14px}#help{display:none}a.btn{display:inline-block;background:var(--ac);color:var(--bg);padding:13px 22px;border-radius:12px;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<h1 id="name">Opening...</h1>
<p id="go">Taking you to your private app.</p>
<div id="help">
  <p>Could not reach the app. It only works when this device is connected to Tailscale. Open the Tailscale app, turn it on, then try again.</p>
  <a class="btn" id="retry" href="#">Try again</a>
</div>
<script>
var HOST = 'https://watson.tail0243ff.ts.net:10000';
var APPS = { upload: '/upload', 'voice-editor': '/voice-editor', books: '/books', ged: '/ged', kitfy: 'http://100.117.237.96:10003/', chi: '/chi/notes', money: 'http://100.117.237.96:10004/', xmas: 'http://100.117.237.96:10006/' };
var app = new URLSearchParams(location.search).get('app');
var path = APPS[app];
if (!path) { document.getElementById('name').textContent = 'Private app'; document.getElementById('go').textContent = 'This page is not available.'; }
else {
  var url = path.indexOf('http') === 0 ? path : HOST + path;
  document.getElementById('name').textContent = app.replace('-', ' ');
  document.getElementById('retry').href = url;
  setTimeout(function () { location.replace(url); }, 150);
  setTimeout(function () { document.getElementById('go').style.display = 'none'; document.getElementById('help').style.display = 'block'; }, 4000);
}
</script>
</body>
</html>
