<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>GED Study Coach</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1c2230;--mute:#667085;--line:#e3e6ee;--brand:#4f46e5;--bi:#fff;--bad:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#10131a;--card:#1a1f2b;--ink:#eef1f7;--mute:#98a2b3;--line:#2a3142;--brand:#818cf8;--bi:#10131a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:320px;text-align:center}
h1{font-size:22px;margin:0 0 4px}p{color:var(--mute);margin:0 0 16px;font-size:15px}
.dots{display:flex;justify-content:center;gap:14px;margin:8px 0 18px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--brand)}
.dots i.on{background:var(--brand)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keys button{padding:14px 0;font:inherit;font-size:22px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.keys button:active{background:var(--line)}
#msg{min-height:22px;color:var(--bad);font-size:15px;margin-top:12px}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
</head>
<body>
<div class="box" id="box">
  <h1>🎓 GED Study Coach</h1>
  <p>Enter your 4-digit code</p>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
  <div class="keys" id="keys"></div>
  <div id="msg" role="alert"></div>
</div>
<script>
let pin = "", busy = false;
const dots = document.querySelectorAll("#dots i"), msg = document.getElementById("msg");
const draw = () => dots.forEach((d, i) => d.classList.toggle("on", i < pin.length));
async function submit() {
  busy = true; msg.textContent = "";
  try {
    const r = await fetch("/api/ged/unlock", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pin }) });
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.ok) { location.reload(); return; }
    msg.textContent = j.error || "Something went wrong.";
  } catch (e) { msg.textContent = "Can't reach the server. Try again."; }
  pin = ""; draw(); busy = false;
  const b = document.getElementById("box"); b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
}
function press(k) {
  if (busy) return;
  if (k === "⌫") pin = pin.slice(0, -1); else if (pin.length < 4) pin += k;
  draw(); if (pin.length === 4) submit();
}
const keys = document.getElementById("keys");
["1","2","3","4","5","6","7","8","9","","0","⌫"].forEach(k => {
  const b = document.createElement("button");
  if (!k) { b.style.visibility = "hidden"; b.disabled = true; } else { b.textContent = k; b.onclick = () => press(k); b.setAttribute("aria-label", k === "⌫" ? "Delete" : k); }
  keys.appendChild(b);
});
addEventListener("keydown", e => { if (/^\d$/.test(e.key)) press(e.key); else if (e.key === "Backspace") press("⌫"); });
</script>
</body>
</html>
