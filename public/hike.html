<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Property Line Finder</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#fff; --fg:#111; --card:rgba(255,255,255,.94); --accent:#0b5fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --card:rgba(30,30,30,.94); } }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:15px/1.35 system-ui,sans-serif; }
  #map { position:absolute; inset:0; }
  .bar { position:absolute; z-index:1000; left:8px; right:8px; background:var(--card); border-radius:10px; padding:8px 10px; box-shadow:0 2px 8px #0005; }
  #info { top:calc(8px + env(safe-area-inset-top)); }
  #info b { font-size:16px; }
  #stats { bottom:calc(112px + env(safe-area-inset-bottom)); font-variant-numeric:tabular-nums; display:grid; grid-template-columns:repeat(3,1fr); gap:4px 8px; text-align:center; }
  #stats small { display:block; opacity:.65; font-size:11px; }
  #stats b { font-size:17px; }
  #btns { bottom:calc(8px + env(safe-area-inset-bottom)); display:flex; gap:6px; flex-wrap:wrap; }
  #btns button { flex:1; min-width:30%; padding:12px 6px; font-size:15px; border:0; border-radius:8px; background:var(--accent); color:#fff; }
  #btns button.off { background:#666; }
  .dot { width:18px; height:18px; border-radius:50%; background:#0b5fff; border:3px solid #fff; box-shadow:0 0 6px #000a; }

  #sosWrap { position:absolute; z-index:1100; left:10px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; align-items:center; gap:6px; }
  #sos { width:112px; height:112px; border-radius:50%; border:6px solid #fff; background:#d70015; color:#fff; font-size:30px; font-weight:800; box-shadow:0 3px 14px #000a; }
  #sos:active { background:#a00010; }
  #sosMode { font-size:12px; font-weight:700; padding:5px 9px; border:0; border-radius:12px; background:#1b8a3a; color:#fff; }
  #sosMode.live { background:#d70015; }
  #sosOv { position:fixed; inset:0; z-index:3000; background:#b00012; color:#fff; display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px; gap:14px; overflow:auto; }
  #sosOv h1 { margin:0; font-size:34px; }
  #sosOv .big { font-size:80px; font-weight:800; line-height:1; }
  #sosOv button, #sosOv a.btn { font-size:22px; font-weight:700; padding:16px 26px; border:0; border-radius:12px; background:#fff; color:#b00012; text-decoration:none; }
  #sosOv .stop { background:#111; color:#fff; font-size:26px; padding:22px 30px; }
  #sosMsg { font-size:17px; max-width:420px; white-space:pre-line; }
  .hrow { padding:10px 0; border-bottom:1px solid #8884; }
  .hrow button { margin:6px 6px 0 0; padding:9px 14px; font-size:15px; border:0; border-radius:8px; background:#0b5fff; color:#fff; }
</style>
</head>
<body>
<div id="map"></div>
<div class="bar" id="info"><b id="where">Waiting for GPS...</b><br><span id="acc">Allow location access when asked.</span> <button id="loc" style="margin-top:6px;padding:10px 12px;font-size:15px;border:0;border-radius:8px;background:#0b5fff;color:#fff">Tap to enable my location</button></div>
<div class="bar" id="stats" style="display:none"></div>
<div class="bar" id="btns">
  <button id="follow">Follow: on</button>
  <button id="sat">Imagery</button>
  <button id="trail" class="off">Record: off</button>
  <button id="mark">Drop pin</button>
  <button id="gpx" class="off">Save GPX</button>
  <button id="histBtn" class="off">History</button>
</div>


<div id="hist" style="display:none;position:fixed;inset:0;z-index:2500;background:var(--bg);color:var(--fg);overflow:auto;padding:14px calc(14px + env(safe-area-inset-right)) 14px 14px"><h2 style="margin:4px 0 10px">Saved hikes</h2><div id="histList"></div><button id="histClose" style="margin-top:12px;padding:14px 20px;font-size:16px;border:0;border-radius:8px;background:#0b5fff;color:#fff">Close</button></div>
<div id="sosWrap"><button id="sos">SOS</button><button id="sosMode">TEST: Emily only</button></div>
<div id="sosOv"><h1 id="sosTitle"></h1><div class="big" id="sosBig"></div><div id="sosMsg"></div><div id="sosBtns" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/esri-leaflet@3.0.12/dist/esri-leaflet.js"></script>
<script>
const SVC = "https://enterprise.firstmap.delaware.gov/arcgis/rest/services/PlanningCadastre/DE_StateParcels/MapServer";
// Iron Hill Park area, used until the first GPS fix arrives
const map = L.map("map", { zoomControl:false, maxZoom:20 }).setView([39.6000, -75.7400], 16);
L.control.zoom({ position:"topright" }).addTo(map);

const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom:20, maxNativeZoom:19, attribution:"Esri" });
const topo = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}", { maxZoom:20, maxNativeZoom:19, attribution:"Esri" });
let useSat = true; sat.addTo(map);

// Parcel boundaries (State of Delaware parcels; drawn only when zoomed in to about 1:24,000)
L.esri.dynamicMapLayer({ url:SVC, layers:[0], opacity:1, f:"image" }).addTo(map);

const OWN = "https://gis.nccde.org/agsserver/rest/services/CustomMaps/Ownership/MapServer/0";
const $ = id => document.getElementById(id);
let me = null, circle = null, following = true, trailOn = false, lastQ = 0;
const R = { id:0, pts:[], dist:0, moving:0, gain:0, loss:0, start:0, lastT:0, altRef:null, alts:[] };
const trail = L.polyline([], { color:"#ff2d55", weight:3 }).addTo(map);
const hl = L.layerGroup().addTo(map);

function showParcel(latlng, label) {
  L.esri.query({ url: SVC + "/0" }).intersects(latlng).run((err, fc) => {
    hl.clearLayers();
    if (err || !fc || !fc.features.length) { $("where").textContent = label + "no parcel found here"; return; }
    const f = fc.features[0], p = f.properties;
    L.geoJSON(f, { style:{ color:"#ffd400", weight:4, fillOpacity:.08 } }).addTo(hl);
    const base = label + "Parcel " + p.PIN + " (" + (+p.ACRES).toFixed(1) + " ac)";
    $("where").textContent = base;
    const q = new URLSearchParams({ f:"json", geometry:latlng.lng + "," + latlng.lat, geometryType:"esriGeometryPoint", inSR:"4326",
      spatialRel:"esriSpatialRelIntersects", outFields:"CNTCTLAST,ADDRESS", returnGeometry:"false" });
    fetch(OWN + "/query?" + q).then(r => r.json()).then(d => {
      const a = d.features && d.features[0] && d.features[0].attributes;
      if (!a) return;
      const addr = (a.ADDRESS || "").replace(/\s+/g, " ").trim();
      $("where").textContent = base + " | Owner: " + (a.CNTCTLAST || "unknown").trim() + (addr ? " | " + addr : "");
    }).catch(() => {});
  });
}

map.on("click", e => showParcel(e.latlng, "Tapped: "));


const M2FT = 3.28084, M2MI = 1 / 1609.344;
function record(pos, ll) {
  const a = pos.coords.accuracy, t = pos.timestamp;
  if (a > 40) return;                       // ignore poor fixes
  const last = R.pts[R.pts.length - 1];
  if (last) {
    const d = L.latLng(last.lat, last.lng).distanceTo(ll), dt = (t - last.t) / 1000;
    if (d < Math.max(4, a * 0.3)) return;   // jitter while standing still
    R.dist += d;
    if (dt > 0 && d / dt > 0.3) R.moving += dt;
  } else { R.start = R.start || t; }
  let alt = pos.coords.altitude;
  if (alt != null) {                        // smooth, then count only changes over 3 m
    R.alts.push(alt); if (R.alts.length > 5) R.alts.shift();
    const sm = R.alts.reduce((x, y) => x + y, 0) / R.alts.length;
    if (R.altRef == null) R.altRef = sm;
    else if (Math.abs(sm - R.altRef) >= 3) { if (sm > R.altRef) R.gain += sm - R.altRef; else R.loss += R.altRef - sm; R.altRef = sm; }
    alt = sm;
  }
  R.pts.push({ lat:ll.lat, lng:ll.lng, alt, t });
  R.lastT = t;
  trail.addLatLng(ll);
  save(); renderStats();
}
function fmtT(sec) { sec = Math.round(sec); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), x = sec % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); }
function renderStats() {
  const mi = R.dist * M2MI, el = R.start ? (Date.now() - R.start) / 1000 : 0;
  const pace = mi > 0.02 ? R.moving / 60 / mi : 0;
  const alt = R.altRef == null ? "n/a" : Math.round(R.altRef * M2FT) + " ft";
  $("stats").innerHTML =
    "<div><b>" + mi.toFixed(2) + " mi</b><small>Distance</small></div>" +
    "<div><b>" + fmtT(el) + "</b><small>Elapsed</small></div>" +
    "<div><b>" + (pace ? fmtT(pace * 60) + "/mi" : "--") + "</b><small>Pace (moving)</small></div>" +
    "<div><b>+" + Math.round(R.gain * M2FT) + " ft</b><small>Climb</small></div>" +
    "<div><b>-" + Math.round(R.loss * M2FT) + " ft</b><small>Descent</small></div>" +
    "<div><b>" + alt + "</b><small>Elevation (GPS)</small></div>";
}
function save() { try { localStorage.setItem("hikeRec", JSON.stringify(R)); } catch (e) {} }
function load() {
  try { const r = JSON.parse(localStorage.getItem("hikeRec") || "null"); if (r && r.pts && r.pts.length) { Object.assign(R, r); trail.setLatLngs(R.pts.map(p => [p.lat, p.lng])); $("stats").style.display = "grid"; renderStats(); } } catch (e) {}
}
setInterval(() => { if (trailOn) renderStats(); }, 1000);
function gpx(points, startMs) {
  const pts = points.map(p => '<trkpt lat="' + p.lat + '" lon="' + p.lng + '">' + (p.alt != null ? "<ele>" + p.alt.toFixed(1) + "</ele>" : "") + "<time>" + new Date(p.t).toISOString() + "</time></trkpt>").join("");
  const xml = '<?xml version="1.0"?><gpx version="1.1" creator="wtsn.me/hike" xmlns="http://www.topografix.com/GPX/1/1"><trk><name>Hike</name><trkseg>' + pts + "</trkseg></trk></gpx>";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([xml], { type:"application/gpx+xml" }));
  a.download = "hike-" + new Date(startMs || Date.now()).toISOString().slice(0, 16).replace(/[:T]/g, "-") + ".gpx"; a.click();
}

// ---------- hike history (saved automatically when Record is stopped) ----------
function getHist() { try { return JSON.parse(localStorage.getItem("hikeHistory") || "[]"); } catch (e) { return []; } }
function putHist(h) { try { localStorage.setItem("hikeHistory", JSON.stringify(h)); return true; } catch (e) { alert("Could not save hike history: phone storage is full or blocked."); return false; } }
function archiveHike() {
  if (R.pts.length < 2) return;
  if (!R.id) R.id = R.start || Date.now();
  const h = getHist().filter(x => x.id !== R.id);
  h.unshift({ id:R.id, start:R.start, end:R.lastT, dist:R.dist, moving:R.moving, gain:R.gain, loss:R.loss,
    pts:R.pts.map(p => [+p.lat.toFixed(6), +p.lng.toFixed(6), p.alt == null ? null : +p.alt.toFixed(1), p.t]) });
  putHist(h); save();
}
const toPts = a => a.map(q => ({ lat:q[0], lng:q[1], alt:q[2], t:q[3] }));
let viewLine = null;
function openHist() {
  const h = getHist(), box = $("histList");
  box.innerHTML = h.length ? "" : "<p>No saved hikes yet. A hike is saved here automatically each time you stop recording.</p>";
  h.forEach(x => {
    const mi = x.dist * M2MI, pace = mi > 0.02 ? fmtT(x.moving / 60 / mi * 60) + "/mi" : "--";
    const d = document.createElement("div"); d.className = "hrow";
    d.innerHTML = "<b>" + new Date(x.start).toLocaleString([], { month:"short", day:"numeric", hour:"numeric", minute:"2-digit" }) + "</b><br>" +
      mi.toFixed(2) + " mi | " + fmtT((x.end - x.start) / 1000) + " | " + pace + " | +" + Math.round(x.gain * M2FT) + " / -" + Math.round(x.loss * M2FT) + " ft<br>";
    [["View", () => { if (viewLine) map.removeLayer(viewLine); viewLine = L.polyline(x.pts.map(q => [q[0], q[1]]), { color:"#ff9500", weight:4 }).addTo(map); map.fitBounds(viewLine.getBounds(), { padding:[40, 40] }); $("hist").style.display = "none"; following = false; $("follow").textContent = "Follow: off"; $("follow").classList.add("off"); }],
     ["GPX", () => gpx(toPts(x.pts), x.start)],
     ["Delete", () => { if (confirm("Delete this saved hike?")) { putHist(getHist().filter(y => y.id !== x.id)); openHist(); } }]
    ].forEach(([l, fn]) => { const b = document.createElement("button"); b.textContent = l; b.onclick = fn; d.appendChild(b); });
    box.appendChild(d);
  });
  $("hist").style.display = "block";
}
load();

function feet(m) { return Math.round(m * 3.281) + " ft"; }

let lastFix = 0, fixes = 0, wid = null, curAcc = 0, curSpd = null;
function onPos(pos) {
  lastFix = Date.now(); fixes++; curSpd = pos.coords.speed;
  const ll = L.latLng(pos.coords.latitude, pos.coords.longitude), a = pos.coords.accuracy;
  if (!me) {
    me = L.marker(ll, { icon:L.divIcon({ className:"", html:'<div class="dot"></div>', iconSize:[18,18] }), zIndexOffset:1000 }).addTo(map);
    circle = L.circle(ll, { radius:a, weight:1, color:"#0b5fff", fillOpacity:.1 }).addTo(map);
    map.setView(ll, 18);
  }
  me.setLatLng(ll); circle.setLatLng(ll).setRadius(a);
  if (trailOn) record(pos, ll);
  if (following) map.panTo(ll, { animate:true });
  curAcc = a; showAcc();
  lastPos = { lat:ll.lat, lng:ll.lng, acc:a, ts:pos.timestamp };
  try { localStorage.setItem("hikeLastPos", JSON.stringify(lastPos)); } catch (e) {}
  const now = Date.now();
  if (now - lastQ > 8000) { lastQ = now; showParcel(ll, "You are on: "); }
}
function showAcc() {
  if (!lastFix) return;
  const age = Math.round((Date.now() - lastFix) / 1000);
  $("acc").textContent = "GPS ±" + feet(curAcc) + " | " + (curSpd != null && curSpd > 0.5 ? Math.round(curSpd * 2.237) + " mph | " : "") + "fix " + (age < 2 ? "now" : age + "s ago") + " (#" + fixes + ")" + (curAcc > 30 ? " weak signal" : "");
}
setInterval(() => {
  if (!lastFix) return;
  const age = (Date.now() - lastFix) / 1000;
  if (age > 15 && wid != null) { navigator.geolocation.clearWatch(wid); wid = null; watching = false; startGps(); }
  else showAcc();
}, 2000);
function onErr(err) {
  $("acc").textContent = (err.code === 1
    ? "Location blocked. If you're in Telegram's browser, tap the ... menu and choose Open in Safari/Chrome. Also check Settings > Privacy > Location Services > your browser."
    : "GPS error: " + err.message);
}
let watching = false;
function startGps() {
  if (!navigator.geolocation) { $("acc").textContent = "This browser has no location support. Open in Safari or Chrome."; return; }
  $("acc").textContent = "Requesting location...";
  wid = navigator.geolocation.watchPosition(p => { watching = true; $("loc").style.display = "none"; onPos(p); }, onErr,
    { enableHighAccuracy:true, maximumAge:1000, timeout:30000 });
}
let t0 = 0;
function startGps2() {
  startGps();
  clearTimeout(t0);
  t0 = setTimeout(() => {
    if (watching) return;
    const inApp = /Telegram|FBAN|FBAV|Instagram|Line\//i.test(navigator.userAgent);
    $("acc").textContent = "No response from the browser after 8 seconds." + (inApp ? " You appear to be in an in-app browser. " : " ") +
      "Copy this address, paste it into Safari or Chrome directly: wtsn.me/hike.html";
  }, 8000);
  if (navigator.permissions) navigator.permissions.query({ name:"geolocation" }).then(r => {
    if (r.state === "denied") $("acc").textContent = "Location is set to DENIED for this site/browser. Fix it in your phone's Settings > this browser > Location, then reload.";
  }).catch(() => {});
}
$("loc").onclick = startGps2;
startGps2();


map.on("dragstart", () => { following = false; $("follow").textContent = "Follow: off"; $("follow").classList.add("off"); });
$("follow").onclick = () => { following = !following; $("follow").textContent = "Follow: " + (following ? "on" : "off"); $("follow").classList.toggle("off", !following); if (following && me) map.panTo(me.getLatLng()); };
$("sat").onclick = () => { map.removeLayer(useSat ? sat : topo); useSat = !useSat; (useSat ? sat : topo).addTo(map).bringToBack(); };
$("trail").onclick = () => {
  trailOn = !trailOn;
  $("trail").textContent = "Record: " + (trailOn ? "on" : "off"); $("trail").classList.toggle("off", !trailOn);
  if (!trailOn) { archiveHike(); return; }       // stopped: saved to History automatically
  if (R.pts.length && !confirm("Continue the last hike? Cancel starts a new one (the last one stays in History).")) { archiveHike(); Object.assign(R, { id:0, pts:[], dist:0, moving:0, gain:0, loss:0, start:0, lastT:0, altRef:null, alts:[] }); trail.setLatLngs([]); }
  if (viewLine) { map.removeLayer(viewLine); viewLine = null; }
  if (!R.start) R.start = Date.now();
  if (!R.id) R.id = R.start;
  $("stats").style.display = "grid"; renderStats();
};
$("gpx").onclick = () => { if (R.pts.length) gpx(R.pts, R.start); else alert("Nothing recorded yet. Tap Record first."); };
$("histBtn").onclick = openHist;
$("histClose").onclick = () => { $("hist").style.display = "none"; };
$("mark").onclick = () => {
  if (!me) return;
  const ll = me.getLatLng();
  L.marker(ll).addTo(map).bindPopup("Pin<br>" + ll.lat.toFixed(6) + ", " + ll.lng.toFixed(6) + "<br>±" + feet(circle.getRadius())).openPopup();
};

// ---------- SOS safety button ----------
// Server decides recipients: test = Emily only, live = Melanie, Emily, Micah, Khaela.
let lastPos = null, sosTest = true, sosState = null;
try { lastPos = JSON.parse(localStorage.getItem("hikeLastPos") || "null"); sosTest = localStorage.getItem("hikeSosLive") !== "1"; } catch (e) {}
function paintMode() { const b = $("sosMode"); b.textContent = sosTest ? "TEST: Emily only" : "LIVE: family"; b.classList.toggle("live", !sosTest); }
paintMode();
$("sosMode").onclick = () => {
  if (sosTest) {
    if (!confirm("Switch to LIVE mode? The SOS button will text Melanie, Emily, Micah and Khaela.")) return;
    sosTest = false;
  } else sosTest = true;
  try { localStorage.setItem("hikeSosLive", sosTest ? "0" : "1"); } catch (e) {}
  paintMode();
};

const ov = $("sosOv");
function ovShow(title, big, msg, btns) {
  ov.style.display = "flex"; $("sosTitle").textContent = title; $("sosBig").textContent = big || ""; $("sosMsg").textContent = msg || "";
  const box = $("sosBtns"); box.innerHTML = "";
  (btns || []).forEach(b => {
    const el = document.createElement(b.href ? "a" : "button"); el.textContent = b.label; if (b.href) { el.href = b.href; el.className = "btn"; } if (b.cls) el.className = b.cls; if (b.fn) el.onclick = b.fn; box.appendChild(el);
  });
}
function ovHide() { ov.style.display = "none"; }
const CALL911 = { label:"Call 911", href:"tel:911" };

async function getPos() {
  if (lastPos && Date.now() - lastPos.ts < 10 * 60 * 1000) return lastPos;
  const fresh = await new Promise(res => navigator.geolocation.getCurrentPosition(
    p => res({ lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy, ts:p.timestamp }), () => res(null), { enableHighAccuracy:true, timeout:6000, maximumAge:60000 }));
  return fresh || lastPos;
}
async function post(url, body) {
  const r = await fetch(url, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(body) });
  if (r.status === 401) throw new Error("login");
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || ("HTTP " + r.status));
  return d;
}
const names = rs => rs.filter(x => x.ok).map(x => x.name).join(", ");

$("sos").onclick = () => {
  if (sosState) return;
  const test = sosTest;
  sosState = { test, cancelled:false, stream:null };
  // Ask for the microphone now, while we still have the tap gesture.
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia)
    navigator.mediaDevices.getUserMedia({ audio:true }).then(st => { if (sosState) sosState.stream = st; else st.getTracks().forEach(t => t.stop()); }).catch(() => {});
  let n = test ? 3 : 5;
  const who = test ? "TEST MODE: Emily only" : "LIVE: Melanie, Emily, Micah, Khaela";
  const tick = () => {
    if (!sosState || sosState.cancelled) return;
    if (n === 0) return sendSos();
    ovShow("Sending SOS in", String(n), who, [{ label:"CANCEL", fn:cancelSos }]);
    n--; sosState.timer = setTimeout(tick, 1000);
  };
  tick();
};
function cancelSos() {
  if (sosState) { sosState.cancelled = true; clearTimeout(sosState.timer); if (sosState.stream) sosState.stream.getTracks().forEach(t => t.stop()); }
  sosState = null; ovHide();
}
function closeSos() { cancelSos(); }

async function sendSos() {
  const st = sosState; if (!st) return;
  ovShow("Sending...", "", "Getting your location and texting your family.", [CALL911]);
  const pos = await getPos();
  if (!pos) return ovShow("No GPS position yet", "", "I can't text without a location. Call 911 or move to open sky and try again.", [CALL911, { label:"Try again", fn:() => { sosState = null; $("sos").click(); } }, { label:"Close", fn:closeSos }]);
  const coord = pos.lat.toFixed(6) + ", " + pos.lng.toFixed(6);
  let d = null, err = null;
  for (let i = 0; i < 6 && !d && !st.cancelled; i++) {
    try { d = await post("/api/hike/sos", { mode:st.test ? "test" : "live", lat:pos.lat, lng:pos.lng, acc:pos.acc, ts:pos.ts }); }
    catch (e) { err = e; if (e.message === "login") break; ovShow("Sending...", "", "Retrying (" + (i + 1) + "/6). " + e.message + "\nYour position: " + coord, [CALL911]); await new Promise(r => setTimeout(r, 4000)); }
  }
  if (st.cancelled) return;
  if (!d) {
    const m = err && err.message === "login" ? "You are not logged in. Open wtsn.me/sms once and enter your PIN, then come back." : "Could not send. Check cell signal.";
    return ovShow("NOT SENT", "", m + "\nRead this to 911 or a family member: " + coord, [CALL911, { label:"Retry", fn:() => { sosState = null; $("sos").click(); } }, { label:"Close", fn:closeSos }]);
  }
  st.sent = names(d.results);
  startRecording(coord);
}

async function startRecording(coord) {
  const st = sosState; if (!st) return;
  let stream = st.stream;
  if (!stream) { try { stream = await navigator.mediaDevices.getUserMedia({ audio:true }); } catch (e) {} }
  const head = "Location texted to " + (st.sent || "no one") + ".\n" + coord;
  if (!stream || typeof MediaRecorder === "undefined")
    return ovShow("Location sent", "", head + "\n\nMicrophone not available, so no voice message.", [CALL911, { label:"Close", fn:closeSos }]);
  const mt = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"].find(t => MediaRecorder.isTypeSupported(t)) || "";
  const rec = new MediaRecorder(stream, mt ? { mimeType:mt } : undefined), chunks = [];
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  let secs = 0, stopped = false;
  const stop = () => { if (stopped) return; stopped = true; clearInterval(iv); rec.stop(); };
  rec.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    const blob = new Blob(chunks, { type: rec.mimeType || mt || "audio/webm" });
    await uploadAudio(blob, head);
  };
  const paint = () => ovShow("RECORDING", fmtT(secs), head + "\nSpeak your message, then tap Stop. It sends right away to their phones.", [{ label:"Stop and send", cls:"stop", fn:stop }]);
  const iv = setInterval(() => { secs++; if (secs >= 120) stop(); else paint(); }, 1000);
  rec.start(1000); paint();
}

async function uploadAudio(blob, head) {
  const st = sosState; if (!st) return;
  if (blob.size < 500) return ovShow("Nothing recorded", "", head, [CALL911, { label:"Close", fn:closeSos }]);
  const b64 = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.readAsDataURL(blob); });
  const attempt = async () => {
    ovShow("Sending voice message...", "", head, [CALL911]);
    try {
      const d = await post("/api/hike/audio", { mode:st.test ? "test" : "live", audio_base64:b64 });
      ovShow("Voice message sent", "", "Sent to " + names(d.results) + ".\n" + head, [CALL911, { label:"Close", fn:closeSos }]);
    } catch (e) {
      ovShow("Voice message NOT sent", "", e.message + "\n" + head, [{ label:"Retry send", fn:attempt }, CALL911, { label:"Close", fn:closeSos }]);
    }
  };
  attempt();
}
</script>
