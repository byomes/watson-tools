<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Property Line Finder</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#fff; --fg:#111; --card:rgba(255,255,255,.94); --accent:#0b5fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --card:rgba(30,30,30,.94); } }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:15px/1.35 system-ui,sans-serif; }
  #map { position:absolute; inset:0; }
  .bar { position:absolute; z-index:1000; left:8px; right:8px; background:var(--card); border-radius:10px; padding:8px 10px; box-shadow:0 2px 8px #0005; }
  #info { top:calc(8px + env(safe-area-inset-top)); }
  #info b { font-size:16px; }
  #stats { bottom:calc(112px + env(safe-area-inset-bottom)); font-variant-numeric:tabular-nums; display:grid; grid-template-columns:repeat(3,1fr); gap:4px 8px; text-align:center; }
  #stats small { display:block; opacity:.65; font-size:11px; }
  #stats b { font-size:17px; }
  #btns { bottom:calc(8px + env(safe-area-inset-bottom)); display:flex; gap:6px; flex-wrap:wrap; }
  #btns button { flex:1; min-width:30%; padding:12px 6px; font-size:15px; border:0; border-radius:8px; background:var(--accent); color:#fff; }
  #btns button.off { background:#666; }
  .dot { width:18px; height:18px; border-radius:50%; background:#0b5fff; border:3px solid #fff; box-shadow:0 0 6px #000a; }
</style>
</head>
<body>
<div id="map"></div>
<div class="bar" id="info"><b id="where">Waiting for GPS...</b><br><span id="acc">Allow location access when asked.</span> <button id="loc" style="margin-top:6px;padding:10px 12px;font-size:15px;border:0;border-radius:8px;background:#0b5fff;color:#fff">Tap to enable my location</button></div>
<div class="bar" id="stats" style="display:none"></div>
<div class="bar" id="btns">
  <button id="follow">Follow: on</button>
  <button id="sat">Imagery</button>
  <button id="trail" class="off">Record: off</button>
  <button id="mark">Drop pin</button>
  <button id="gpx" class="off">Save GPX</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/esri-leaflet@3.0.12/dist/esri-leaflet.js"></script>
<script>
const SVC = "https://enterprise.firstmap.delaware.gov/arcgis/rest/services/PlanningCadastre/DE_StateParcels/MapServer";
// Iron Hill Park area, used until the first GPS fix arrives
const map = L.map("map", { zoomControl:false, maxZoom:20 }).setView([39.6000, -75.7400], 16);
L.control.zoom({ position:"topright" }).addTo(map);

const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom:20, maxNativeZoom:19, attribution:"Esri" });
const topo = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}", { maxZoom:20, maxNativeZoom:19, attribution:"Esri" });
let useSat = true; sat.addTo(map);

// Parcel boundaries (State of Delaware parcels; drawn only when zoomed in to about 1:24,000)
L.esri.dynamicMapLayer({ url:SVC, layers:[0], opacity:1, f:"image" }).addTo(map);

const OWN = "https://gis.nccde.org/agsserver/rest/services/CustomMaps/Ownership/MapServer/0";
const $ = id => document.getElementById(id);
let me = null, circle = null, following = true, trailOn = false, lastQ = 0;
const R = { pts:[], dist:0, moving:0, gain:0, loss:0, start:0, lastT:0, altRef:null, alts:[] };
const trail = L.polyline([], { color:"#ff2d55", weight:3 }).addTo(map);
const hl = L.layerGroup().addTo(map);

function showParcel(latlng, label) {
  L.esri.query({ url: SVC + "/0" }).intersects(latlng).run((err, fc) => {
    hl.clearLayers();
    if (err || !fc || !fc.features.length) { $("where").textContent = label + "no parcel found here"; return; }
    const f = fc.features[0], p = f.properties;
    L.geoJSON(f, { style:{ color:"#ffd400", weight:4, fillOpacity:.08 } }).addTo(hl);
    const base = label + "Parcel " + p.PIN + " (" + (+p.ACRES).toFixed(1) + " ac)";
    $("where").textContent = base;
    const q = new URLSearchParams({ f:"json", geometry:latlng.lng + "," + latlng.lat, geometryType:"esriGeometryPoint", inSR:"4326",
      spatialRel:"esriSpatialRelIntersects", outFields:"CNTCTLAST,ADDRESS", returnGeometry:"false" });
    fetch(OWN + "/query?" + q).then(r => r.json()).then(d => {
      const a = d.features && d.features[0] && d.features[0].attributes;
      if (!a) return;
      const addr = (a.ADDRESS || "").replace(/\s+/g, " ").trim();
      $("where").textContent = base + " | Owner: " + (a.CNTCTLAST || "unknown").trim() + (addr ? " | " + addr : "");
    }).catch(() => {});
  });
}

map.on("click", e => showParcel(e.latlng, "Tapped: "));


const M2FT = 3.28084, M2MI = 1 / 1609.344;
function record(pos, ll) {
  const a = pos.coords.accuracy, t = pos.timestamp;
  if (a > 40) return;                       // ignore poor fixes
  const last = R.pts[R.pts.length - 1];
  if (last) {
    const d = L.latLng(last.lat, last.lng).distanceTo(ll), dt = (t - last.t) / 1000;
    if (d < Math.max(4, a * 0.3)) return;   // jitter while standing still
    R.dist += d;
    if (dt > 0 && d / dt > 0.3) R.moving += dt;
  } else { R.start = R.start || t; }
  let alt = pos.coords.altitude;
  if (alt != null) {                        // smooth, then count only changes over 3 m
    R.alts.push(alt); if (R.alts.length > 5) R.alts.shift();
    const sm = R.alts.reduce((x, y) => x + y, 0) / R.alts.length;
    if (R.altRef == null) R.altRef = sm;
    else if (Math.abs(sm - R.altRef) >= 3) { if (sm > R.altRef) R.gain += sm - R.altRef; else R.loss += R.altRef - sm; R.altRef = sm; }
    alt = sm;
  }
  R.pts.push({ lat:ll.lat, lng:ll.lng, alt, t });
  R.lastT = t;
  trail.addLatLng(ll);
  save(); renderStats();
}
function fmtT(sec) { sec = Math.round(sec); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), x = sec % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); }
function renderStats() {
  const mi = R.dist * M2MI, el = R.start ? (Date.now() - R.start) / 1000 : 0;
  const pace = mi > 0.02 ? R.moving / 60 / mi : 0;
  const alt = R.altRef == null ? "n/a" : Math.round(R.altRef * M2FT) + " ft";
  $("stats").innerHTML =
    "<div><b>" + mi.toFixed(2) + " mi</b><small>Distance</small></div>" +
    "<div><b>" + fmtT(el) + "</b><small>Elapsed</small></div>" +
    "<div><b>" + (pace ? fmtT(pace * 60) + "/mi" : "--") + "</b><small>Pace (moving)</small></div>" +
    "<div><b>+" + Math.round(R.gain * M2FT) + " ft</b><small>Climb</small></div>" +
    "<div><b>-" + Math.round(R.loss * M2FT) + " ft</b><small>Descent</small></div>" +
    "<div><b>" + alt + "</b><small>Elevation (GPS)</small></div>";
}
function save() { try { localStorage.setItem("hikeRec", JSON.stringify(R)); } catch (e) {} }
function load() {
  try { const r = JSON.parse(localStorage.getItem("hikeRec") || "null"); if (r && r.pts && r.pts.length) { Object.assign(R, r); trail.setLatLngs(R.pts.map(p => [p.lat, p.lng])); $("stats").style.display = "grid"; renderStats(); } } catch (e) {}
}
setInterval(() => { if (trailOn) renderStats(); }, 1000);
function gpx() {
  const pts = R.pts.map(p => '<trkpt lat="' + p.lat + '" lon="' + p.lng + '">' + (p.alt != null ? "<ele>" + p.alt.toFixed(1) + "</ele>" : "") + "<time>" + new Date(p.t).toISOString() + "</time></trkpt>").join("");
  const xml = '<?xml version="1.0"?><gpx version="1.1" creator="wtsn.me/hike" xmlns="http://www.topografix.com/GPX/1/1"><trk><name>Hike</name><trkseg>' + pts + "</trkseg></trk></gpx>";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([xml], { type:"application/gpx+xml" }));
  a.download = "hike-" + new Date().toISOString().slice(0, 10) + ".gpx"; a.click();
}
load();

function feet(m) { return Math.round(m * 3.281) + " ft"; }

let lastFix = 0, fixes = 0, wid = null, curAcc = 0, curSpd = null;
function onPos(pos) {
  lastFix = Date.now(); fixes++; curSpd = pos.coords.speed;
  const ll = L.latLng(pos.coords.latitude, pos.coords.longitude), a = pos.coords.accuracy;
  if (!me) {
    me = L.marker(ll, { icon:L.divIcon({ className:"", html:'<div class="dot"></div>', iconSize:[18,18] }), zIndexOffset:1000 }).addTo(map);
    circle = L.circle(ll, { radius:a, weight:1, color:"#0b5fff", fillOpacity:.1 }).addTo(map);
    map.setView(ll, 18);
  }
  me.setLatLng(ll); circle.setLatLng(ll).setRadius(a);
  if (trailOn) record(pos, ll);
  if (following) map.panTo(ll, { animate:true });
  curAcc = a; showAcc();
  const now = Date.now();
  if (now - lastQ > 8000) { lastQ = now; showParcel(ll, "You are on: "); }
}
function showAcc() {
  if (!lastFix) return;
  const age = Math.round((Date.now() - lastFix) / 1000);
  $("acc").textContent = "GPS ±" + feet(curAcc) + " | " + (curSpd != null && curSpd > 0.5 ? Math.round(curSpd * 2.237) + " mph | " : "") + "fix " + (age < 2 ? "now" : age + "s ago") + " (#" + fixes + ")" + (curAcc > 30 ? " weak signal" : "");
}
setInterval(() => {
  if (!lastFix) return;
  const age = (Date.now() - lastFix) / 1000;
  if (age > 15 && wid != null) { navigator.geolocation.clearWatch(wid); wid = null; watching = false; startGps(); }
  else showAcc();
}, 2000);
function onErr(err) {
  $("acc").textContent = (err.code === 1
    ? "Location blocked. If you're in Telegram's browser, tap the ... menu and choose Open in Safari/Chrome. Also check Settings > Privacy > Location Services > your browser."
    : "GPS error: " + err.message);
}
let watching = false;
function startGps() {
  if (!navigator.geolocation) { $("acc").textContent = "This browser has no location support. Open in Safari or Chrome."; return; }
  $("acc").textContent = "Requesting location...";
  wid = navigator.geolocation.watchPosition(p => { watching = true; $("loc").style.display = "none"; onPos(p); }, onErr,
    { enableHighAccuracy:true, maximumAge:1000, timeout:30000 });
}
let t0 = 0;
function startGps2() {
  startGps();
  clearTimeout(t0);
  t0 = setTimeout(() => {
    if (watching) return;
    const inApp = /Telegram|FBAN|FBAV|Instagram|Line\//i.test(navigator.userAgent);
    $("acc").textContent = "No response from the browser after 8 seconds." + (inApp ? " You appear to be in an in-app browser. " : " ") +
      "Copy this address, paste it into Safari or Chrome directly: wtsn.me/hike.html";
  }, 8000);
  if (navigator.permissions) navigator.permissions.query({ name:"geolocation" }).then(r => {
    if (r.state === "denied") $("acc").textContent = "Location is set to DENIED for this site/browser. Fix it in your phone's Settings > this browser > Location, then reload.";
  }).catch(() => {});
}
$("loc").onclick = startGps2;
startGps2();


map.on("dragstart", () => { following = false; $("follow").textContent = "Follow: off"; $("follow").classList.add("off"); });
$("follow").onclick = () => { following = !following; $("follow").textContent = "Follow: " + (following ? "on" : "off"); $("follow").classList.toggle("off", !following); if (following && me) map.panTo(me.getLatLng()); };
$("sat").onclick = () => { map.removeLayer(useSat ? sat : topo); useSat = !useSat; (useSat ? sat : topo).addTo(map).bringToBack(); };
$("trail").onclick = () => {
  trailOn = !trailOn;
  $("trail").textContent = "Record: " + (trailOn ? "on" : "off"); $("trail").classList.toggle("off", !trailOn);
  if (trailOn) {
    if (R.pts.length && !confirm("Continue the saved hike? Cancel starts a new one.")) { Object.assign(R, { pts:[], dist:0, moving:0, gain:0, loss:0, start:0, lastT:0, altRef:null, alts:[] }); trail.setLatLngs([]); }
    if (!R.start) R.start = Date.now();
    $("stats").style.display = "grid"; renderStats();
  }
};
$("gpx").onclick = () => { if (R.pts.length) gpx(); else alert("Nothing recorded yet. Tap Record first."); };
$("mark").onclick = () => {
  if (!me) return;
  const ll = me.getLatLng();
  L.marker(ll).addTo(map).bindPopup("Pin<br>" + ll.lat.toFixed(6) + ", " + ll.lng.toFixed(6) + "<br>±" + feet(circle.getRadius())).openPopup();
};
</script>
</body>
</html>
